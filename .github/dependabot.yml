version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5  # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age
      # Own actions are exempt from the cooldown.
      exclude:
        - "rewse/*"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5  # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age
    groups:
      docker:
        patterns: ["*"]
    # Stay on the Ubuntu LTS release: still take digest updates of the current
    # tag, but never propose an interim release. Move to the next LTS by hand.
    ignore:
      - dependency-name: ubuntu/ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5  # zizmor: ignore[dependabot-cooldown] Dependabot counts whole days, so 5 keeps the 96-hour minimum package age
    groups:
      pre-commit:
        patterns: ["*"]
